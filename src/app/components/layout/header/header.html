<header class="sticky top-0 z-50 border-b border-sand bg-cream">
  <div class="mx-auto max-w-7xl px-4 md:px-8">
    <div class="grid h-16 grid-cols-[auto_1fr_auto] items-center gap-3 md:h-20 md:gap-8">
      <!-- Logo = Home -->
      <a href="#home" class="shrink-0" aria-label="Mi Casa Tortilleria home">
        <img
          src="images/logo.png"
          alt="Mi Casa Tortilleria"
          class="h-10 w-auto object-contain sm:h-11 md:h-14"
        />
      </a>

      <!-- Navigation -->
      <nav
        class="flex items-center justify-center gap-4 sm:gap-7 md:gap-10 lg:gap-14"
        aria-label="Main navigation"
      >
        <!-- Hidden on mobile -->
        <a
          href="#home"
          class="hidden border-b-2 pb-1 text-base font-medium no-underline transition-colors md:inline-flex md:text-lg"
          [class.border-red]="activeSection() === 'home'"
          [class.border-transparent]="activeSection() !== 'home'"
          [class.text-red]="activeSection() === 'home'"
          [class.text-charcoal]="activeSection() !== 'home'"
        >
          Home
        </a>

        <a
          href="#menu"
          class="border-b-2 pb-1 text-sm font-medium no-underline transition-colors sm:text-base md:text-lg"
          [class.border-red]="activeSection() === 'menu'"
          [class.border-transparent]="activeSection() !== 'menu'"
          [class.text-red]="activeSection() === 'menu'"
          [class.text-charcoal]="activeSection() !== 'menu'"
        >
          Menu
        </a>

        <a
          href="#about"
          class="border-b-2 pb-1 text-sm font-medium no-underline transition-colors sm:text-base md:text-lg"
          [class.border-red]="activeSection() === 'about'"
          [class.border-transparent]="activeSection() !== 'about'"
          [class.text-red]="activeSection() === 'about'"
          [class.text-charcoal]="activeSection() !== 'about'"
        >
          About
        </a>

        <a
          href="#visit"
          class="border-b-2 pb-1 text-sm font-medium no-underline transition-colors sm:text-base md:text-lg"
          [class.border-red]="activeSection() === 'visit'"
          [class.border-transparent]="activeSection() !== 'visit'"
          [class.text-red]="activeSection() === 'visit'"
          [class.text-charcoal]="activeSection() !== 'visit'"
        >
          Visit
        </a>
      </nav>

      <!-- Order -->
      <a
        href="https://order.online/business/~11532486"
        target="_blank"
        rel="noopener noreferrer"
        class="whitespace-nowrap rounded-full bg-red px-3.5 py-2.5 text-sm font-semibold text-white no-underline transition-colors hover:bg-red-dark sm:px-5 sm:text-base md:px-6 md:py-3"
      >
        Order Online
      </a>
    </div>
  </div>
</header>
