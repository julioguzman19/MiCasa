<section class="bg-white py-16 md:py-20 lg:py-24">
  <div class="mx-auto max-w-7xl px-5 md:px-8">
    <!-- Heading -->
    <div class="max-w-2xl">
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-red">Mi Casa Favorites</p>

      <h2 class="mt-3 text-3xl font-bold tracking-tight text-charcoal sm:text-4xl lg:text-5xl">
        What we're known for.
      </h2>

      <p class="mt-4 max-w-xl text-base leading-7 text-brown sm:text-lg">
        From fresh tortillas to family recipes, these are some of the flavors that keep our
        customers coming back.
      </p>
    </div>

    <!-- Food cards -->
    <div class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (food of foods; track food.name) {
        <article class="group">
          <div class="overflow-hidden rounded-2xl">
            <img
              [src]="food.image"
              [alt]="food.name"
              class="aspect-[4/5] w-full object-cover transition-transform duration-300 group-hover:scale-105"
            />
          </div>

          <div class="pt-5">
            <h3 class="text-xl font-semibold text-charcoal">
              {{ food.name }}
            </h3>

            <p class="mt-2 text-sm leading-6 text-brown">
              {{ food.description }}
            </p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
