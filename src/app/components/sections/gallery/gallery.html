<section class="bg-cream py-16 md:py-20 lg:py-24">
  <div class="mx-auto max-w-7xl px-5 md:px-8">
    <!-- Heading -->
    <div class="max-w-2xl">
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-red">Mi Casa</p>

      <h2 class="mt-3 text-3xl font-bold tracking-tight text-charcoal sm:text-4xl lg:text-5xl">
        Made fresh. Served with love.
      </h2>

      <p class="mt-4 max-w-xl text-base leading-7 text-brown sm:text-lg">
        A little look at the food, tortillas, and people that make Mi Casa what it is.
      </p>
    </div>

    <!-- Gallery -->
    <div class="mt-10 grid grid-cols-2 gap-3 md:grid-cols-4 md:gap-4">
      @for (image of images; track image.src; let i = $index) {
        <div class="group overflow-hidden rounded-2xl" [class.md:col-span-2]="i === 0 || i === 5">
          <img
            [src]="image.src"
            [alt]="image.alt"
            class="h-full min-h-[220px] w-full object-cover transition-transform duration-500 group-hover:scale-105 md:min-h-[280px]"
          />
        </div>
      }
    </div>
  </div>
</section>
