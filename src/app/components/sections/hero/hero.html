<section id="home" class="overflow-hidden bg-cream">
  <div
    class="mx-auto grid max-w-[1500px] items-center gap-8 px-5 py-9 md:px-8 md:py-12 lg:grid-cols-[0.85fr_1.15fr] lg:gap-16 lg:px-10 lg:py-14 xl:gap-20 xl:px-12"
  >
    <!-- Content -->
    <div>
      <p class="text-xs font-semibold uppercase tracking-[0.18em] text-red sm:text-sm">
        Family owned since 2012
      </p>

      <p class="mt-2 text-sm font-medium text-brown">West Valley City, Utah</p>

      <h1
        class="mt-5 flex flex-col gap-1 text-[2.5rem] font-bold leading-[1.02] tracking-tight text-charcoal sm:text-5xl lg:text-6xl xl:text-7xl"
      >
        <span>Fresh tortillas.</span>
        <span class="text-red">Family recipes.</span>
        <span>Zacatecas flavor.</span>
      </h1>
    </div>

    <!-- Food Carousel -->
    <div class="mx-auto w-full max-w-[400px] lg:ml-auto lg:mr-0 lg:max-w-[520px]">
      <div class="relative aspect-[4/3] overflow-hidden rounded-3xl bg-white/40">
        @for (image of heroImages; track image.src; let i = $index) {
          <img
            [src]="image.src"
            [alt]="image.alt"
            [attr.aria-hidden]="i === currentIndex() ? null : true"
            class="absolute inset-0 h-full w-full object-cover mix-blend-multiply transition-opacity duration-700"
            [class.opacity-100]="i === currentIndex()"
            [class.opacity-0]="i !== currentIndex()"
          />
        }
      </div>

      <!-- Carousel Controls -->
      <div class="mt-4 flex w-full items-center gap-4">
        <button
          type="button"
          aria-label="Previous food"
          (click)="previousImage()"
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-brown/20 bg-cream text-lg font-semibold text-charcoal transition-colors hover:border-red hover:text-red"
        >
          ‹
        </button>

        <div class="flex flex-1 items-center gap-2">
          @for (image of heroImages; track image.src; let i = $index) {
            <button
              type="button"
              [attr.aria-label]="'Show ' + image.alt"
              (click)="goToImage(i)"
              class="h-1.5 flex-1 rounded-full transition-all duration-300"
              [style.backgroundColor]="
                i === currentIndex() ? 'var(--color-red)' : 'var(--color-sand)'
              "
            ></button>
          }
        </div>

        <button
          type="button"
          aria-label="Next food"
          (click)="nextImage()"
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-brown/20 bg-cream text-lg font-semibold text-charcoal transition-colors hover:border-red hover:text-red"
        >
          ›
        </button>
      </div>
    </div>
  </div>
</section>
