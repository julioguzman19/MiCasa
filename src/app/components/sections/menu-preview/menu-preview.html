<section id="menu" class="bg-cream py-16 md:py-20 lg:py-24">
  <div class="mx-auto max-w-7xl px-5 md:px-8">
    <!-- Heading -->
    <div class="mx-auto max-w-2xl text-center">
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-red">Our Menu</p>

      <h2 class="mt-3 text-3xl font-bold tracking-tight text-charcoal sm:text-4xl lg:text-5xl">
        Come hungry.
      </h2>

      <p class="mt-4 text-base leading-7 text-brown sm:text-lg">
        Mexican favorites, family recipes, and fresh tortillas made right here at Mi Casa.
      </p>
    </div>

    <!-- Categories -->
    <div class="mt-12 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
      @for (category of categories; track category.name) {
        <article
          class="rounded-2xl border border-sand bg-white p-6 transition-colors hover:border-red md:p-7"
        >
          <h3 class="text-xl font-semibold text-charcoal">
            {{ category.name }}
          </h3>

          <ul class="mt-4 space-y-2">
            @for (item of category.items; track item) {
              <li class="flex items-center gap-3 text-brown">
                <span class="h-1.5 w-1.5 shrink-0 rounded-full bg-corn"></span>

                {{ item }}
              </li>
            }
          </ul>
        </article>
      }
    </div>

    <!-- CTA -->
    <div class="mt-10 flex justify-center">
      <a
        href="#"
        class="rounded-full bg-red px-6 py-3 font-semibold text-white no-underline transition-colors hover:bg-red-dark"
      >
        View Full Menu
      </a>
    </div>
  </div>
</section>
