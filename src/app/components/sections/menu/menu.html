<section id="menu" class="bg-sand py-14 md:py-20 lg:py-24">
  <div class="mx-auto max-w-7xl px-4 md:px-8">
    <!-- Heading -->
    <div class="mx-auto max-w-2xl text-center">
      <p class="text-sm font-semibold uppercase tracking-[0.2em] text-red">Our Menu</p>

      <h2 class="mt-3 text-3xl font-bold tracking-tight text-charcoal sm:text-4xl lg:text-5xl">
        Come hungry.
      </h2>

      <p class="mt-4 text-base leading-7 text-brown sm:text-lg">
        Mexican favorites, family recipes, and fresh tortillas made right here at Mi Casa.
      </p>
    </div>

    <!-- Menu Items -->
    <div class="mt-10 grid grid-cols-2 gap-3 sm:gap-5 lg:grid-cols-3 lg:gap-8">
      @for (item of menuItems; track item.name) {
        <article
          class="group overflow-hidden rounded-xl border border-brown/10 bg-cream sm:rounded-2xl"
        >
          <!-- Image -->
          <div class="overflow-hidden bg-white">
            <img
              [src]="item.image"
              [alt]="item.name"
              class="aspect-square w-full object-cover transition-transform duration-300 group-hover:scale-105 sm:aspect-[4/3]"
            />
          </div>

          <!-- Content -->
          <div class="p-3 sm:p-5 lg:p-6">
            <h3 class="text-sm font-semibold text-charcoal sm:text-lg lg:text-xl">
              {{ item.name }}
            </h3>

            <p class="mt-2 hidden text-sm leading-6 text-brown sm:block">
              {{ item.description }}
            </p>
          </div>
        </article>
      }
    </div>
  </div>
</section>
