<section id="visit" class="bg-green py-16 text-white md:py-20 lg:py-24">
  <div class="mx-auto max-w-7xl px-5 md:px-8">
    <div class="grid items-stretch gap-10 lg:grid-cols-2 lg:gap-16">
      <!-- Content -->
      <div class="flex flex-col justify-center">
        <p class="text-sm font-semibold uppercase tracking-[0.2em] text-corn">Visit Mi Casa</p>

        <h2 class="mt-3 text-3xl font-bold tracking-tight sm:text-4xl lg:text-5xl">
          Come eat with us.
        </h2>

        <p class="mt-5 max-w-lg text-base leading-7 text-white/80 sm:text-lg">
          Stop by for fresh tortillas, traditional Mexican food, and family favorites made right
          here at Mi Casa.
        </p>

        <!-- Details -->
        <div class="mt-10 space-y-7">
          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.15em] text-corn">Address</p>

            <p class="mt-2 max-w-sm text-lg leading-7">
              {{ address }}
            </p>
          </div>

          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.15em] text-corn">Phone</p>

            <a
              href="tel:+18019736475"
              class="mt-2 inline-block text-lg text-white no-underline hover:text-corn"
            >
              {{ phone }}
            </a>
          </div>

          <div>
            <p class="text-sm font-semibold uppercase tracking-[0.15em] text-corn">Hours</p>

            <p class="mt-2 text-lg text-white/80">Hours coming soon</p>
          </div>
        </div>

        <!-- Actions -->
        <div class="mt-10 flex flex-wrap gap-3">
          <a
            href="https://www.google.com/maps/search/?api=1&query=2401+Constitution+Boulevard+Salt+Lake+City+UT+84119"
            target="_blank"
            rel="noopener noreferrer"
            class="rounded-full bg-corn px-6 py-3 font-semibold text-charcoal no-underline transition-colors hover:bg-corn-light"
          >
            Get Directions
          </a>

          <a
            href="#"
            class="rounded-full border border-white/50 px-6 py-3 font-semibold text-white no-underline transition-colors hover:bg-white hover:text-green"
          >
            Order Online
          </a>
        </div>
      </div>

      <!-- Map -->
      <div class="min-h-[400px] overflow-hidden rounded-3xl lg:min-h-[520px]">
        <iframe
          title="Mi Casa Tortilleria location"
          src="https://www.google.com/maps?q=2401+Constitution+Boulevard+Salt+Lake+City+UT+84119&output=embed"
          class="h-full min-h-[400px] w-full border-0 lg:min-h-[520px]"
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>
    </div>
  </div>
</section>
